name: Iqbal Sweet House Daily Report

on:
  schedule:
    # 08:30 Pakistan Standard Time (03:30 UTC); reports the previous Pakistan day.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD (leave blank for yesterday in Pakistan)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  send-daily-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-report/requirements.txt
      - name: Install report dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --requirement daily-report/requirements.txt
      - name: Run unit checks
        run: python -m unittest discover -s daily-report/tests -v
      - name: Generate and email report
        run: python daily-report/report.py
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
